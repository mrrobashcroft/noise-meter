<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom Noise Meter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Font: Assistant -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Assistant', system-ui, -apple-system, sans-serif; 
        }
    </style>
</head>
<body class="bg-slate-100 flex flex-col min-h-screen text-slate-800">
    
    <!-- TOP NAVIGATION BAR -->
    <nav class="w-full bg-[#1a647e] text-white border-b border-[#144f63] px-4 sm:px-6 py-3 flex items-center justify-between shadow-md">
        
        <!-- Left: Profile Photo & Name -->
        <a href="https://www.mrrobashcroft.com" class="flex items-center gap-3 text-lg font-normal hover:text-slate-200 transition-colors">
            <img src="https://lh7-us.googleusercontent.com/sitesv-images-rt/AMxu72s2-X-jeMUhzG8egyQvSlmELyLcgm9gbPPk5J_ifUAJ2pNhGz-4ohkg9FeI_vINYxDvbBL91UIOhDHVQH54eX5fE61r8Me5P7_OZ8Ud5VWSLT2CX2GpA_F2e8SoLAVKL_JMl-iSlhr02Ao0YlYxSxyZmSrw-DYkmiVqCvFMZLHutO2h8Fg8E3LOgF6VPF0=w16383" alt="Rob Ashcroft Profile" class="w-9 h-9 rounded-full object-cover border border-white/20">
            <span>Rob Ashcroft</span>
        </a>
        
        <!-- Right: Links -->
        <div class="flex gap-4 sm:gap-6 text-sm sm:text-base font-normal">
            <a href="https://www.mrrobashcroft.com" class="hover:text-slate-200 transition-colors">Home</a>
        </div>
    </nav>

    <!-- MAIN APP WRAPPER -->
    <main class="flex-1 flex flex-col items-center justify-center p-4">
        <div class="bg-white p-8 rounded-3xl shadow-xl w-full max-w-2xl text-center border border-slate-200">
            <h1 class="text-3xl font-bold mb-2">Classroom Volume</h1>
            <p class="text-slate-500 mb-8">Keep the noise in the green zone!</p>
            
            <!-- Start Screen -->
            <div id="startScreen">
                <button id="startBtn" class="bg-emerald-500 hover:bg-emerald-600 text-white px-8 py-4 rounded-2xl font-bold text-xl transition-all shadow-lg hover:shadow-emerald-500/30">
                    🎤 Start Microphone
                </button>
                <p id="errorMsg" class="text-red-500 font-bold mt-4 hidden"></p>
            </div>

            <!-- Meter Screen -->
            <div id="meterScreen" class="hidden w-full animate-fade-in">
                
                <!-- Target Selector -->
                <div class="flex justify-center gap-3 mb-6 bg-slate-50 p-2 rounded-xl inline-flex mx-auto border border-slate-200">
                    <button class="target-btn px-4 py-2 rounded-lg font-bold bg-white text-emerald-700 shadow-sm border border-emerald-200" data-target="35">🤫 Silence</button>
                    <button class="target-btn px-4 py-2 rounded-lg font-bold text-slate-500 hover:bg-slate-200" data-target="60">💬 Quiet Talk</button>
                    <button class="target-btn px-4 py-2 rounded-lg font-bold text-slate-500 hover:bg-slate-200" data-target="85">🗣️ Group Work</button>
                </div>

                <!-- Volume Bar -->
                <div class="w-full h-
